<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - St Louis Shore Bank</title>
  <link rel="icon" type="image/svg+xml" href="storage/app/public/photos/favicon.svg">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;min-height:100vh;display:flex;flex-direction:column}
    /* Navbar */
    .navbar{background:#0f2356;padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between}
    .navbar a{color:#fff;text-decoration:none}
    .navbar .logo{display:flex;align-items:center;gap:8px}
    .navbar .nav-links{display:flex;gap:24px;font-size:14px}
    .navbar .nav-links a:hover{color:#93c5fd}
    /* Card */
    .container{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px}
    .card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.1);padding:40px;width:100%;max-width:440px}
    .card-title{font-size:24px;font-weight:700;color:#0f2356;margin-bottom:6px}
    .card-sub{font-size:14px;color:#64748b;margin-bottom:28px}
    label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px}
    input[type=email],input[type=password],input[type=text]{width:100%;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:15px;outline:none;transition:.15s;margin-bottom:18px}
    input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
    .btn{width:100%;padding:13px;background:#1d4ed8;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:.15s}
    .btn:hover{background:#1e40af}
    .btn:disabled{background:#93c5fd;cursor:not-allowed}
    .error{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:8px;padding:12px 14px;font-size:14px;margin-bottom:16px;display:none}
    .success{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;border-radius:8px;padding:12px 14px;font-size:14px;margin-bottom:16px;display:none}
    .footer-link{text-align:center;margin-top:22px;font-size:14px;color:#64748b}
    .footer-link a{color:#2563eb;font-weight:600;text-decoration:none}
    .footer-link a:hover{text-decoration:underline}
    .divider{border:none;border-top:1px solid #e2e8f0;margin:20px 0}
    .loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.85);display:none;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:16px;font-size:16px;color:#1d4ed8;font-weight:600}
    .spinner{width:40px;height:40px;border:4px solid #dbeafe;border-top:4px solid #1d4ed8;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    footer{background:#0f2356;color:#93c5fd;text-align:center;padding:16px;font-size:13px}
  </style>
</head>
<body>

<div class="loading-overlay" id="overlay">
  <div class="spinner"></div>
  Sending reset link...
</div>

<nav class="navbar">
  <a href="/" class="logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" width="160" height="36">
      <path d="M8 10 L8 38 L16 38 L16 22 L22 34 L28 22 L28 38 L36 38 L36 10 L28 10 L22 24 L16 10 Z" fill="#fff"/>
      <path d="M6 42 Q22 35 38 42" stroke="#93c5fd" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="46" y="29" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">St Louis Shore Bank</text>
      <text x="47" y="42" font-family="Segoe UI,Arial,sans-serif" font-size="8" font-weight="500" fill="#93c5fd" letter-spacing="2.5">BANK</text>
    </svg>
  </a>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="login">Sign In</a>
    <a href="register">Register</a>
  </div>
</nav>

<div class="container">
  <div class="card">
    <h1 class="card-title">Forgot Password</h1>
    <p class="card-sub">Enter your registered email and we'll send you a link to reset your password.</p>

    <div class="error" id="err-msg"></div>
    <div class="success" id="ok-msg"></div>

    <form id="forgot-form" onsubmit="doForgot(event)">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>

      <button type="submit" class="btn" id="submit-btn">Send Reset Link</button>
    </form>

    <hr class="divider">
    <div class="footer-link">
      Remembered your password? <a href="login">Back to sign in</a>
    </div>
  </div>
</div>

<footer>&copy; 2025 St Louis Shore Bank. All rights reserved.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
var SUPA_URL = "https://YOUR-PROJECT-REF.supabase.co";
var SUPA_KEY = "YOUR_SUPABASE_ANON_KEY";
var sb = supabase.createClient(SUPA_URL, SUPA_KEY);

var overlay = document.getElementById("overlay");
var errMsg  = document.getElementById("err-msg");
var okMsg    = document.getElementById("ok-msg");
var btn      = document.getElementById("submit-btn");

function showErr(msg) {
  errMsg.textContent = msg;
  errMsg.style.display = "block";
  overlay.style.display = "none";
  btn.disabled = false;
  btn.textContent = "Send Reset Link";
}
function showOk(msg) {
  okMsg.textContent = msg;
  okMsg.style.display = "block";
  errMsg.style.display = "none";
  overlay.style.display = "none";
  btn.disabled = false;
  btn.textContent = "Send Reset Link";
}

function doForgot(e) {
  e.preventDefault();
  var email = document.getElementById("email").value.trim();
  if (!email || !email.includes("@")) { showErr("Please enter a valid email address."); return; }

  errMsg.style.display = "none";
  okMsg.style.display = "none";
  btn.disabled = true;
  btn.textContent = "Sending...";
  overlay.style.display = "flex";

  // Ask Supabase to send a password-recovery email. We always report the
  // same success message whether or not the account exists — never reveal
  // which addresses are registered.

  sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + "/reset-password" })
    .then(function(res) {
      if (res.error) {
        showErr(res.error.message || "Could not send reset link. Please try again." );
        return;
      }
      showOk("If an account exists for this email, a password reset link has been sent. Please check your inbox (and spam folder).");
      document.getElementById("email").value = "";
    })
    .catch(function() { showErr("Network error. Please try again."); });
}
</script>

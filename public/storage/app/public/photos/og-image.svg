<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#0f2356;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a3a6b;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#1d4ed8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Accent blue line top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentLine)"/>

  <!-- Chart bars (right side decoration) -->
  <g transform="translate(720, 80)" opacity="0.18">
    <rect x="0"   y="320" width="48" height="80"  rx="4" fill="#60a5fa"/>
    <rect x="68"  y="260" width="48" height="140" rx="4" fill="#60a5fa"/>
    <rect x="136" y="190" width="48" height="210" rx="4" fill="#60a5fa"/>
    <rect x="204" y="120" width="48" height="280" rx="4" fill="#60a5fa"/>
    <rect x="272" y="60"  width="48" height="340" rx="4" fill="#60a5fa"/>
    <rect x="340" y="20"  width="48" height="380" rx="4" fill="#60a5fa"/>
    <rect x="408" y="80"  width="48" height="320" rx="4" fill="#60a5fa"/>
  </g>

  <!-- Logo icon mark (left) -->
  <g transform="translate(90, 200)">
    <rect x="0"  y="130" width="22" height="30"  rx="3" fill="url(#barGrad)" opacity="0.55"/>
    <rect x="30" y="95"  width="22" height="65"  rx="3" fill="url(#barGrad)" opacity="0.7"/>
    <rect x="60" y="60"  width="22" height="100" rx="3" fill="url(#barGrad)" opacity="0.85"/>
    <rect x="90" y="20"  width="22" height="140" rx="3" fill="url(#barGrad)"/>
    <polyline points="90,20 101,4 112,20" fill="none" stroke="#60a5fa" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="101" y1="4" x2="101" y2="60" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="90" y="430" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="700" fill="#ffffff" letter-spacing="0">St Louis</text>
  <text x="392" y="430" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="400" fill="#60a5fa" letter-spacing="0">Shore Bank</text>
  

  <!-- Tagline -->
  <text x="90" y="490" font-family="Arial, sans-serif" font-size="26" font-weight="300" fill="rgba(255,255,255,0.55)" letter-spacing="8">DIGITAL BANKING  ·  SECURE  ·  GLOBAL</text>

  <!-- Domain -->
  <text x="90" y="570" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.35)" letter-spacing="2">stlouisshorebank.com</text>
</svg>

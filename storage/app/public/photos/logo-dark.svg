<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Icon mark: upward chart / M shape representing growth -->
  <g transform="translate(4, 8)">
    <!-- Base bar -->
    <rect x="0" y="36" width="6" height="8" rx="1.5" fill="url(#markGrad)" opacity="0.5"/>
    <rect x="9" y="26" width="6" height="18" rx="1.5" fill="url(#markGrad)" opacity="0.65"/>
    <rect x="18" y="16" width="6" height="28" rx="1.5" fill="url(#markGrad)" opacity="0.8"/>
    <rect x="27" y="6" width="6" height="38" rx="1.5" fill="url(#markGrad)"/>
    <!-- Arrow head -->
    <polyline points="27,6 33,0 39,6" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="33" y1="0" x2="33" y2="18" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text x="58" y="38" font-family="'Georgia', 'Times New Roman', serif" font-size="22" font-weight="700" fill="#0f2356" letter-spacing="0">St Louis</text>
  <text x="153" y="38" font-family="'Georgia', 'Times New Roman', serif" font-size="22" font-weight="400" fill="#2563eb" letter-spacing="0">Shore Bank</text>
  
  <!-- Tagline -->
  <text x="58" y="51" font-family="'Arial', sans-serif" font-size="7.5" font-weight="400" fill="#64748b" letter-spacing="2.5">DIGITAL BANKING</text>
</svg>
